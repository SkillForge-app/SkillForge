# Local stack check (OPS-03): compose.yaml is valid, every image is pinned by digest, and
# postgres + redis become healthy with the first-start init applied. Not a required check.
# The `web` job builds the web image from frontend/ and checks the app answers; the `api` job builds
# the API image from backend/, runs the migration and checks the API answers (each skipped without
# its folder). The `worker` job builds the worker image from ai/, fills the model cache with
# model-init (twice: the second run offline must download nothing) and checks the placeholder
# worker loads the model with no network, and fails clearly on an empty cache; it also builds the
# staging target (`baked`: the model inside, read-only) and checks it offline. Run it by hand with
# `data-ref`, `frontend-ref` or `backend-ref` to test another branch's data/db/ SQL, frontend/ or
# backend/, e.g. Data-Engineering, Frontend or Backend.
name: compose

on:
  pull_request:
    branches: [main, AI, Backend, Frontend, Data-Engineering, DevOps]
    paths:
      - compose.yaml
      - .env.example
      - devops/compose/**
      - data/db/**
      - frontend/**
      - backend/**
      - devops/docker/**
      - .github/workflows/compose.yml
      # The worker image: AI's locked dependencies, the model pin and the code that fetches it
      - ai/pyproject.toml
      - ai/uv.lock
      - ai/core/llm/models.yaml
      - ai/core/llm/local_embed.py
  push:
    branches: [main]
    paths:
      - compose.yaml
      - .env.example
      - devops/compose/**
      - data/db/**
      - frontend/**
      - backend/**
      - devops/docker/**
      - .github/workflows/compose.yml
      - ai/pyproject.toml
      - ai/uv.lock
      - ai/core/llm/models.yaml
      - ai/core/llm/local_embed.py
  workflow_dispatch:
    inputs:
      data-ref:
        description: "Branch whose data/db/ to use (empty: the checked-out one)"
        required: false
        default: ""
      frontend-ref:
        description: "Branch whose frontend/ to use (empty: the checked-out one)"
        required: false
        default: ""
      backend-ref:
        description: "Branch whose backend/ to use (empty: the checked-out one)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Per event and inputs, so a manual run doesn't cancel the push run on the same branch.
  group: compose-${{ github.ref }}-${{ github.event_name }}-${{ inputs.data-ref }}-${{ inputs.frontend-ref }}-${{ inputs.backend-ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: stack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use data/db/ from another branch
        if: inputs.data-ref != ''
        env:
          DATA_REF: ${{ inputs.data-ref }}
        run: |
          git fetch --depth=1 origin "refs/heads/${DATA_REF}"
          git checkout FETCH_HEAD -- data/db
          ls data/db
      - name: Use the example settings
        run: cp .env.example .env
      - name: compose.yaml is valid
        run: docker compose config --quiet
      - name: Every image is pinned by digest
        run: |
          docker compose config --images | tee /tmp/images.txt
          if grep -v '@sha256:' /tmp/images.txt; then
            echo "::error::the images above are not pinned by digest"
            exit 1
          fi
      - name: Start postgres and redis
        run: docker compose up --detach --wait --wait-timeout 180 postgres redis
      - name: The database is initialised
        run: |
          sql() { docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U skillforge -d skillforge -Atc "$1"; }
          [ "$(sql "SELECT count(*) FROM pg_extension WHERE extname = 'vector'")" = 1 ]
          if [ -f data/db/schema-draft.sql ]; then
            [ "$(sql "SELECT to_regclass('knowledge.knowledge_chunks') IS NOT NULL")" = t ]
            [ "$(sql "SELECT count(*) FROM pg_roles WHERE rolname = 'skillforge_ai_reader'")" = 1 ]
            echo "data/db/ applied: knowledge.knowledge_chunks and skillforge_ai_reader exist"
          else
            echo "::notice::no data/db/ here; checked pgvector only"
          fi
      - name: Redis answers
        run: '[ "$(docker compose exec -T redis redis-cli ping)" = PONG ]'
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --volumes

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # An unusual value, so the check below proves the build arg reaches the browser code.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use frontend/ from another branch
        if: inputs.frontend-ref != ''
        env:
          FRONTEND_REF: ${{ inputs.frontend-ref }}
        run: |
          git fetch --depth=1 origin "refs/heads/${FRONTEND_REF}"
          git checkout FETCH_HEAD -- frontend
      - name: Is there a frontend?
        id: project
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no frontend/package.json here; the web image is not built"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The base image is pinned by digest
        run: |
          grep -nE '^(ARG NODE_IMAGE=|FROM )' devops/docker/web.Dockerfile
          if grep -E '^ARG NODE_IMAGE=' devops/docker/web.Dockerfile | grep -v '@sha256:'; then
            echo "::error::NODE_IMAGE is not pinned by digest"
            exit 1
          fi
          if grep -E '^FROM ' devops/docker/web.Dockerfile | grep -vE 'FROM (\$\{NODE_IMAGE\}|deps) '; then
            echo "::error::every FROM must use NODE_IMAGE (or an earlier stage)"
            exit 1
          fi
      - name: Use the example settings
        if: steps.project.outputs.present == 'true'
        run: cp .env.example .env
      - name: Build the web image
        if: steps.project.outputs.present == 'true'
        run: docker compose --profile web build web
      - name: Start web
        if: steps.project.outputs.present == 'true'
        run: docker compose --profile web up --detach --wait --wait-timeout 180 web
      - name: The app answers, with its static assets, as a non-root user
        if: steps.project.outputs.present == 'true'
        run: |
          curl -fsS -o /tmp/index.html -w 'HTTP %{http_code}\n' http://127.0.0.1:3000/
          grep -qi '<html' /tmp/index.html
          # The page's own JS/CSS must load too (a standalone server without .next/static gives 404s).
          asset="$(grep -oE '/_next/static/[^"]+\.(js|css)' /tmp/index.html | head -n 1)"
          if [ -z "${asset}" ]; then
            echo "::error::the page references no /_next/static asset"
            exit 1
          fi
          curl -fsS -o /dev/null -w "HTTP %{http_code} ${asset}\n" "http://127.0.0.1:3000${asset}"
          uid="$(docker compose --profile web exec -T web id -u)"
          echo "uid ${uid}"
          [ "${uid}" != 0 ]
      - name: The API URL is baked into the browser code
        if: steps.project.outputs.present == 'true'
        run: |
          if docker compose --profile web exec -T web grep -rqF "${NEXT_PUBLIC_API_BASE_URL}" apps/web/.next/static; then
            echo "${NEXT_PUBLIC_API_BASE_URL} is in the browser code"
          elif grep -rqE 'lib/api/client|createApiClient\(' frontend/apps/web/app frontend/apps/web/components 2>/dev/null; then
            echo "::error::the app uses the API client, but ${NEXT_PUBLIC_API_BASE_URL} is not in the browser code"
            exit 1
          else
            echo "::notice::no page uses the API client yet, so the URL is not in the bundle; check skipped"
          fi
      - name: Logs
        if: failure() && steps.project.outputs.present == 'true'
        run: docker compose --profile web logs --no-color web
      - name: Clean up
        if: always() && steps.project.outputs.present == 'true'
        run: docker compose --profile web down --volumes

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use backend/ from another branch
        if: inputs.backend-ref != ''
        env:
          BACKEND_REF: ${{ inputs.backend-ref }}
        run: |
          git fetch --depth=1 origin "refs/heads/${BACKEND_REF}"
          git checkout FETCH_HEAD -- backend
      - name: Is there a backend, with what the image needs?
        id: project
        run: |
          if [ ! -f backend/app/main.py ]; then
            echo "::notice::no backend/app/main.py here; the API image is not built"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for f in pyproject.toml uv.lock alembic.ini; do
            [ -f "backend/$f" ] || missing="${missing} backend/$f"
          done
          if [ -n "${missing}" ]; then
            echo "::error::the API image needs${missing} (devops/compose.md, API)"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: The base image and uv are pinned
        run: |
          f=devops/docker/api.Dockerfile
          grep -nE '^(ARG (PYTHON_IMAGE|UV_VERSION|UV_SHA256_[A-Z0-9_]+)=|FROM )' "$f"
          if ! grep -E '^ARG PYTHON_IMAGE=' "$f" | grep -q '@sha256:'; then
            echo "::error::PYTHON_IMAGE is not pinned by digest"
            exit 1
          fi
          if grep -E '^FROM ' "$f" | grep -vE 'FROM \$\{PYTHON_IMAGE\} '; then
            echo "::error::every FROM must use PYTHON_IMAGE"
            exit 1
          fi
          if [ "$(grep -cE '^ARG UV_SHA256_[A-Z0-9_]+=[0-9a-f]{64}$' "$f")" != 2 ]; then
            echo "::error::uv needs a sha256 for x86_64 and aarch64"
            exit 1
          fi
      - name: Use the example settings
        if: steps.project.outputs.present == 'true'
        run: cp .env.example .env
      - name: Build the API image
        if: steps.project.outputs.present == 'true'
        run: docker compose --profile api build migrate
      - name: Migrate, then start the API
        if: steps.project.outputs.present == 'true'
        run: |
          docker compose --profile api up --detach api
          for _ in $(seq 1 60); do
            code="$(docker compose --profile api ps --all migrate --format '{{.ExitCode}}')"
            state="$(docker compose --profile api ps --all migrate --format '{{.State}}')"
            if [ "${state}" = exited ] && [ "${code}" != 0 ]; then
              echo "::error::migrate exited with code ${code}"
              exit 1
            fi
            health="$(docker compose --profile api ps api --format '{{.Health}}')"
            if [ "${health}" = healthy ]; then
              echo "migrate: exit ${code}; api: healthy"
              exit 0
            fi
            sleep 3
          done
          echo "::error::api did not become healthy within 180 s"
          exit 1
      - name: Migrated, answering, not root, next to DE's schema
        if: steps.project.outputs.present == 'true'
        run: |
          sql() { docker compose exec -T postgres psql -U skillforge -d skillforge -Atc "$1"; }
          version="$(sql 'SELECT version_num FROM alembic_version')"
          echo "alembic version ${version}"
          [ -n "${version}" ]
          curl -fsS -o /dev/null -w 'HTTP %{http_code} /openapi.json\n' http://127.0.0.1:8000/openapi.json
          uid="$(docker compose --profile api exec -T api id -u)"
          echo "uid ${uid}"
          [ "${uid}" != 0 ]
          if [ -f data/db/schema-draft.sql ]; then
            [ "$(sql "SELECT to_regclass('knowledge.knowledge_chunks') IS NOT NULL")" = t ]
            echo "DE's knowledge schema is intact"
          fi
      - name: Logs
        if: failure() && steps.project.outputs.present == 'true'
        run: docker compose --profile api logs --no-color migrate api
      - name: Clean up
        if: always() && steps.project.outputs.present == 'true'
        run: docker compose --profile api down --volumes

  worker:
    name: worker
    runs-on: ubuntu-24.04
    # About 3-6 minutes: the locked AI dependencies and one 66 MB model download.
    timeout-minutes: 15
    env:
      IMAGE: skillforge-worker:local
      VOLUME: skillforge_models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is there an ai/ with its lock?
        id: project
        run: |
          if [ -f ai/pyproject.toml ] && [ -f ai/uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no ai/pyproject.toml + ai/uv.lock here; the worker image is not built"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The base image is pinned by digest, and the same as the API image's
        run: |
          worker="$(grep -E '^ARG PYTHON_IMAGE=' devops/docker/worker.Dockerfile)"
          api="$(grep -E '^ARG PYTHON_IMAGE=' devops/docker/api.Dockerfile)"
          echo "worker: ${worker}"
          echo "api:    ${api}"
          if ! printf '%s\n' "${worker}" | grep -q '@sha256:'; then
            echo "::error::PYTHON_IMAGE in worker.Dockerfile is not pinned by digest"
            exit 1
          fi
          if [ "${worker}" != "${api}" ]; then
            echo "::error::worker.Dockerfile and api.Dockerfile must use the same PYTHON_IMAGE"
            exit 1
          fi
          # Every stage starts from PYTHON_IMAGE, or from the `runtime` stage built on it (the
          # staging `baked` target).
          if grep -E '^FROM ' devops/docker/worker.Dockerfile | grep -vE 'FROM (\$\{PYTHON_IMAGE\}|runtime) AS '; then
            echo "::error::every FROM must use PYTHON_IMAGE (or the runtime stage)"
            exit 1
          fi
      - name: Use the example settings
        if: steps.project.outputs.present == 'true'
        run: cp .env.example .env
      - name: Build the worker image (locked install, pip check)
        if: steps.project.outputs.present == 'true'
        run: docker compose --profile worker build model-init
      - name: It runs as a non-root user and holds no .env
        if: steps.project.outputs.present == 'true'
        run: |
          uid="$(docker run --rm --network none "${IMAGE}" id -u)"
          echo "uid ${uid}"
          [ "${uid}" != 0 ]
          found="$(docker run --rm --network none "${IMAGE}" sh -c 'find /app -name ".env*" -not -path "/app/.venv/*" | wc -l')"
          echo ".env files under /app: ${found}"
          [ "${found}" = 0 ]
      - name: model-init fills the cache, and a second run offline downloads nothing
        if: steps.project.outputs.present == 'true'
        run: |
          docker compose --profile worker run --rm model-init
          # Without a network, this succeeds only when the pinned file is there with its sha256.
          docker run --rm --network none -v "${VOLUME}:/models" "${IMAGE}" \
            python -m core.llm.local_embed download
      - name: The worker loads the model with no network and a read-only cache
        if: steps.project.outputs.present == 'true'
        run: |
          docker run --rm --network none -e HF_HUB_OFFLINE=1 -v "${VOLUME}:/models:ro" "${IMAGE}" \
            python /app/devops/worker_check.py --once
      - name: The compose worker starts after model-init and reports the model
        if: steps.project.outputs.present == 'true'
        run: |
          docker compose --profile worker up --detach worker
          for _ in $(seq 1 40); do
            if docker compose --profile worker logs worker | grep -q 'worker placeholder: model ok'; then
              docker compose --profile worker logs --no-log-prefix worker
              exit 0
            fi
            sleep 3
          done
          echo "::error::the worker did not report the model within 120 s"
          exit 1
      - name: An empty cache fails clearly, without downloading
        if: steps.project.outputs.present == 'true'
        run: |
          docker volume create skillforge_models_empty > /dev/null
          set +e
          docker run --rm --network none -e HF_HUB_OFFLINE=1 -v skillforge_models_empty:/models:ro \
            "${IMAGE}" python /app/devops/worker_check.py --once > /tmp/empty.log 2>&1
          code=$?
          set -e
          cat /tmp/empty.log
          docker volume rm skillforge_models_empty > /dev/null
          [ "${code}" = 1 ]
          grep -q 'model-init service downloads it' /tmp/empty.log
      - name: "Staging image (--target baked): the model is inside, read-only, and works offline"
        if: steps.project.outputs.present == 'true'
        run: |
          docker build --file devops/docker/worker.Dockerfile --target baked \
            --tag skillforge-worker:baked .
          # No volume and no network: only the model baked into the image can make this pass.
          docker run --rm --network none skillforge-worker:baked \
            python /app/devops/worker_check.py --once
          offline="$(docker run --rm --network none skillforge-worker:baked printenv HF_HUB_OFFLINE)"
          echo "HF_HUB_OFFLINE=${offline}"
          [ "${offline}" = 1 ]
          # The app user cannot change the model: /models and everything in it is root-owned and
          # read-only.
          docker run --rm -i --network none skillforge-worker:baked sh -s <<'CHECK'
          set -eu
          [ "$(id -u)" != 0 ]
          [ "$(stat -c %U /models)" = root ]
          if [ -n "$(find /models ! -user root)" ]; then echo "not root-owned under /models"; exit 1; fi
          if [ -n "$(find /models -writable)" ]; then echo "writable under /models:"; find /models -writable; exit 1; fi
          if touch /models/probe 2>/dev/null; then echo "/models is writable"; exit 1; fi
          echo "model files: $(find /models -type f | wc -l), all root-owned and read-only"
          CHECK
      - name: Logs
        if: failure() && steps.project.outputs.present == 'true'
        run: docker compose --profile worker logs --no-color model-init worker
      - name: Clean up
        if: always() && steps.project.outputs.present == 'true'
        run: docker compose --profile worker down --volumes
