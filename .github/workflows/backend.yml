# Backend CI (OPS-02), called by ci.yml when backend/ changed.
# Skeleton: devops/ci/run-project.sh finds the project type and runs install, lint and tests if they
# exist. Backend replaces or extends these steps when it needs more.
name: backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: hashFiles('backend/pyproject.toml') != ''
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('backend/package.json') != '' && hashFiles('backend/.nvmrc') != ''
        with:
          node-version-file: backend/.nvmrc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('backend/package.json') != '' && hashFiles('backend/.nvmrc') == ''
        with:
          node-version: "24"
      - name: Install, lint and test
        run: bash devops/ci/run-project.sh backend
