# ---------------------------------------------------------------- blocklist
# Checked first. Every entry says why, and the review sheet lists what each rule removed.
blocked:
  # Spam planted on hijacked or forgotten parts of real sites (seen in real results).
  - {pattern: "/Download_PDFS/", reason: "SEO spam (fake PDF download pages)"}
  - {pattern: "/default\\.aspx/[A-Za-z0-9-]{4,}/\\d+/", reason: "SEO spam (fake document pages)"}
  - {pattern: "/\\^\\d+", reason: "SEO spam (fake document pages)"}
  - {pattern: "/(BOOK|PLAY|DOC)/[^/]+/[^/]+/", reason: "SEO spam (fake document pages)"}
  - {pattern: "/ProductPdf/", reason: "SEO spam (fake document pages)"}
  - {pattern: "^https?://(mail|autoconfig|analytics-origin|buildstatus|my-test|demo\\d*|staging|test|dev|lists|ratings)\\.", reason: "infrastructure subdomain serving articles (often hijacked for SEO spam)"}
  - {pattern: "^https?://lb-\\d+-\\d+-\\d+-\\d+", reason: "mirror of another site on a load-balancer host: use the original"}
  - {host: irishplaces.flinders.edu.au, reason: "SEO spam on a hijacked university subdomain"}
  # Staging and test copies (review of 2026-10-26): a subdomain named for staging, test or dev,
  # e.g. ccrsstg-acquia.nysed.gov or stagingmolly.molevalley.gov.uk. Crawl the live site.
  - {pattern: "(?i)^https?://([a-z0-9-]+\\.)*[a-z0-9-]*(stg(?=[-.\\d])|staging|acquia)[a-z0-9-]*\\.[^/]+\\.", reason: "staging or test copy of a site: use the live page"}
  - {pattern: "(?i)^https?://([a-z0-9-]+\\.)*([a-z0-9]+-)?(dev|test)\\d*(-[a-z0-9-]+)?\\.[^/]+\\.", reason: "staging or test copy of a site: use the live page"}
  # Copies and archives: crawl the original instead.
  - {host: govukdiff.njk.onl, reason: "copy of another site: use the original"}
  - {host: corpora.tika.apache.org, reason: "test corpus copy of other sites' files: use the original"}
  - {host: webarchive.library.unt.edu, reason: "web archive copy: use the original"}
  - {suffix: .onrender.com, reason: "app-hosting subdomain (often a mirror): use the original"}
  - {pattern: "/(hub_feeds|feed_items)/", reason: "feed aggregator copy of another site: use the original"}
  # User-generated content and social media: unvetted, and their terms forbid scraping.
  - {host: reddit.com, reason: "user forum; terms forbid scraping"}
  - {host: quora.com, reason: "user Q&A; terms forbid scraping"}
  - {host: pinterest.com, reason: "social media"}
  - {host: linkedin.com, reason: "social media; terms forbid scraping"}
  - {host: facebook.com, reason: "social media; terms forbid scraping"}
  - {host: x.com, reason: "social media"}
  - {host: twitter.com, reason: "social media"}
  - {host: instagram.com, reason: "social media"}
  - {host: tiktok.com, reason: "social media"}
  # Uploaded documents and homework sites: authorship and rights unknown.
  - {host: scribd.com, reason: "user-uploaded documents (rights unknown)"}
  - {host: slideshare.net, reason: "user-uploaded slides (rights unknown)"}
  - {host: academia.edu, reason: "user-uploaded papers (rights unknown)"}
  - {host: coursehero.com, reason: "homework document dump"}
  - {host: chegg.com, reason: "homework answers"}
  - {host: studocu.com, reason: "student notes dump"}
  - {host: cliffsnotes.com, reason: "student notes dump"}
  - {host: docs.google.com, reason: "user documents (authorship unknown)"}
  # Video, audio and shops: nothing to read or learn from.
  - {host: youtube.com, reason: "video site"}
  - {host: vimeo.com, reason: "video site"}
  - {host: tunein.com, reason: "audio site"}
  - {pattern: "^https?://([a-z0-9-]+\\.)*storytel\\.", reason: "audiobook shop"}
  - {pattern: "^https?://([a-z0-9-]+\\.)*(ebay|amazon)\\.", reason: "shop listing"}
