# Source discovery registry (AI-09): how search queries are worded, which sites count as
# authoritative, what is blocked, and the licence note DE-04 receives with every URL.
# This is reviewable data: change it by pull request (AI lead + DE lead).
#
# Licence notes are conservative defaults for a legal reviewer, not legal advice:
#   public-domain-us-gov          US federal government work (17 U.S.C. 105)
#   cc-by-4.0, cc-by-sa-4.0       Creative Commons: attribute (and share alike)
#   copyright-summarise-and-cite  the default: use only short summaries, always cite (spec §5)
#   excluded-terms                the site's terms forbid scraping or reuse: never crawled
version: 1.4.0

# ---------------------------------------------------------------- queries
# Topic = the domain's sub-area as words, put into the area's `topic` pattern; `hint` adds the
# kind of source we want. Acronyms are written out in capitals.
acronyms: [ai, ml, hr, pr, seo, sre, api, ui, ux, it, nda]
areas:
  technology: {topic: "{sub}", hint: "official documentation"}
  data: {topic: "data {sub}", hint: "guide"}
  design: {topic: "{sub} design", hint: "guidelines"}
  product: {topic: "product {sub}", hint: "guide"}
  marketing: {topic: "marketing {sub}", hint: "guide"}
  sales: {topic: "sales {sub}", hint: "guide"}
  customer-support: {topic: "customer support {sub}", hint: "guide"}
  operations: {topic: "{sub}", hint: "operations guide"}
  hr: {topic: "{sub}", hint: "employer guidance"}
  education: {topic: "{sub}", hint: "teaching guide"}
  writing: {topic: "{sub}", hint: "writing guide"}
  research: {topic: "{sub} research", hint: "methods guide"}
  finance: {topic: "{sub} finance", hint: "government guidance"}
  legal: {topic: "{sub}", hint: "law"}
  medical: {topic: "{sub}", hint: "clinical guidance"}
  general: {topic: "{sub}", hint: "guide"}
# Domain hints: added where the generic queries brought back off-topic pages (reviews of
# 2026-10-26). `queries` run before the templates (at most 8 queries in all); `terms` also
# count as on-topic words when ranking. `authorities` are the sites the reviewer named as this
# domain's experts: they get a bonus, and most hint queries name them so search finds their
# pages. `exclude` drops pages that mention a word that marks them off topic here, and
# `templates: false` skips the generic templates. Domains whose results were on topic have none.
domains:
  legal/contracts:
    templates: false  # "contracts guidelines site:.gov" brings back procurement handbooks
    jurisdiction: US  # review-nda is about US law; other jurisdictions rank below, labelled
    authorities: [law.cornell.edu, gov.uk, nolo.com, americanbar.org]
    # Pinned: always first, still subject to robots, licence and the high-risk crawl rule.
    # Each URL was opened and its title checked. The ABA's consumer contract guide is not
    # pinned: americanbar.org refused our requests (HTTP 403), so it could not be checked.
    pinned:
      - {url: "https://www.law.cornell.edu/wex/non-disclosure_agreement_(nda)", title: "non-disclosure agreement (NDA)", verified: "2026-10-26"}
      - {url: "https://www.law.cornell.edu/wex/contract", title: "contract", verified: "2026-10-26"}
      # NDAs protect trade secrets; added when the stricter rules left too few US sources.
      - {url: "https://www.law.cornell.edu/wex/trade_secret", title: "trade secret", verified: "2026-10-26"}
      - {url: "https://www.uspto.gov/ip-policy/trade-secret-policy", title: "Trade secret policy", verified: "2026-10-26"}
    terms: ["non-disclosure agreement", "NDA", "contract law", "confidentiality agreement"]
    queries:
      # The two Cornell LII Wex queries were dropped once both Wex pages were pinned: they
      # mostly brought back law-review scholarship and Cornell's own NDA forms.
      - "non-disclosure agreements site:gov.uk"
      - "nolo.com nondisclosure agreements trade secrets"
      - "American Bar Association contract law guide"
      - "non-disclosure agreement NDA guide"
  hr/recruiting:
    authorities: [eeoc.gov, shrm.org, dol.gov, gov.uk]
    pinned:
      - {url: "https://www.eeoc.gov/prohibited-employment-policiespractices", title: "Prohibited Employment Policies/Practices", verified: "2026-10-26"}
      - {url: "https://www.dol.gov/general/topic/hiring", title: "Hiring", verified: "2026-10-26"}
      - {url: "https://www.shrm.org/topics-tools/tools/interview-questions", title: "Sample Job Interview Questions", verified: "2026-10-26"}
    terms: ["hiring process", "structured interview", "job description", "fair hiring"]
    queries:
      - "eeoc.gov prohibited employment practices hiring"
      - "shrm.org structured interview guide"
      - "dol.gov hiring process employers"
      - "gov.uk recruiting staff employer guidance job description"
  medical/patient-education:
    authorities: [cdc.gov, ahrq.gov, medlineplus.gov]
    terms: ["health literacy", "teach-back", "plain language", "lab test results"]
    queries:
      - "cdc.gov health literacy plain language"
      - "ahrq.gov health literacy universal precautions toolkit teach-back"
      - "medlineplus.gov understanding lab test results"
  technology/ai:
    terms: ["machine learning", "large language model", "artificial intelligence"]
    queries:
      - "machine learning engineering best practices"
      - "large language model evaluation guide"
    pinned:
      - {url: "https://www.nist.gov/itl/ai-risk-management-framework", title: "AI Risk Management Framework", verified: "2026-10-26"}
      - {url: "https://developers.google.com/machine-learning/guides/rules-of-ml", title: "Rules of Machine Learning: Best Practices for ML Engineering", verified: "2026-10-26"}
      - {url: "https://genai.owasp.org/llm-top-10/", title: "2025 Top 10 Risk & Mitigations for LLMs and Gen AI Apps", verified: "2026-10-26"}
  technology/software-engineering:
    # Terms only: the seed skill reviews code, and pages on code review or the SWEBOK often
    # never say "software engineering" in their title or URL.
    terms: ["code review", "SWEBOK"]
  technology/incident-response:
    authorities: [sre.google, response.pagerduty.com, atlassian.com]
    terms: ["postmortem", "blameless", "incident management", "site reliability engineering"]
    queries:
      - "sre.google postmortem culture"
      - "response.pagerduty.com postmortem"
      - "atlassian incident management handbook postmortem"
      - "blameless postmortem guide"
  data/analytics:
    terms: ["data analysis", "statistics", "data visualization"]
    queries:
      - "data analysis statistics guide site:.gov"
      - "data visualization guidelines"
  marketing/strategy:
    authorities: [sba.gov, ftc.gov]
    # SBA's old marketing-and-sales and market-research URLs now redirect to "Plan your
    # business", which covers both.
    pinned:
      - {url: "https://www.ftc.gov/business-guidance/advertising-marketing", title: "Advertising and Marketing", verified: "2026-10-26"}
      - {url: "https://www.ftc.gov/business-guidance/resources/ftcs-endorsement-guides-what-people-are-asking", title: "FTC's Endorsement Guides: What People Are Asking", verified: "2026-10-26"}
      - {url: "https://www.sba.gov/counseling/plan-your-business/", title: "Plan your business", verified: "2026-10-26"}
    exclude: ["medicare", "part d marketing"]  # Medicare plan marketing rules, not strategy
    terms: ["marketing plan", "advertising", "marketing strategy"]
    queries:
      - "sba.gov business guide market research competitive analysis"
      - "ftc.gov advertising and marketing business guidance"
      - "small business marketing plan site:.gov"
      - "truth in advertising business guidance"
  finance/small-business:
    authorities: [sba.gov, irs.gov, score.org]
    terms: ["budget", "cash flow", "financial management"]
    queries:
      - "sba.gov manage your finances"
      - "irs.gov small business self-employed"
      - "score.org small business budget cash flow"
      - "small business budget cash flow site:.gov"
  writing/public-relations:
    authorities: [prsa.org, cipr.co.uk, instituteforpr.org]
    terms: ["press release", "news release", "public relations", "ethics"]
    queries:
      - "PRSA code of ethics public relations"  # CIPR has no query: search returned only its newsroom
      - "public relations standards"  # finds the IPR pages
      - "how to write a press release site:.edu"
      - "news release style guide"

# Two templates ask the search engine for authority directly (site:.gov, site:.edu). Brave and
# most search APIs support `site:`; a provider that does not just gets broader results.
templates:
  - "{topic} {hint}"
  - "{topic} best practices"
  - "{topic} guidelines site:.gov"
  - "{topic} guide site:.edu"
  - "{topic} standards"

# ---------------------------------------------------------------- authority
# First match wins, and blocked rules are checked before these. `host` matches the site and
# its subdomains, `suffix` the end of the host, `host_prefix` its start (both must hold when
# given together). `areas` limits where a source counts as on-topic authority (empty: any).
# Tiers: official 100 (government, standards and professional bodies, official docs),
# academic 80 (universities, journals, scholarly publishers), reference 60 (encyclopedias,
# well-known practitioner documentation), unknown 30 (everything else).
sources:
  # US federal government: public domain (17 U.S.C. 105).
  - {host: nist.gov, tier: official, kind: "US standards body (NIST)", licence: public-domain-us-gov, areas: [technology, data, operations]}
  - {host: cisa.gov, tier: official, kind: "US cybersecurity agency (CISA)", licence: public-domain-us-gov, areas: [technology, operations]}
  - {host: nasa.gov, tier: official, kind: "US government agency (NASA)", licence: public-domain-us-gov, areas: [technology]}
  - {host: gsa.gov, tier: official, kind: "US government agency (GSA)", licence: public-domain-us-gov}
  - {host: medlineplus.gov, tier: official, kind: "US National Library of Medicine (MedlinePlus)", licence: public-domain-us-gov, areas: [medical]}
  - {host: nih.gov, tier: official, kind: "US National Institutes of Health", licence: public-domain-us-gov, areas: [medical, research, data]}
