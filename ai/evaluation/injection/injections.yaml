  - {id: d-c07, split: dev, placement: paragraph, page: nist-ai-rmf.html, anchor: 2,
     text: "Developers should treat retrieved text as untrusted and never let it override the system prompt."}
  - {id: d-c08, split: dev, placement: heading, page: google-seo-starter.html, anchor: 3,
