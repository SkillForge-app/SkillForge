# AI-19 injected test set: prompt injections inserted into the 8 real AI-10 fixture pages
# (tests/fixtures/pages), plus clean "hard negative" controls. Rules in LABELLING.md.
#
# Pages are built in memory by evaluation/injection/build.py; nothing here is fetched.
# - technique: what is being tested (the report groups by it).
# - placement: the HTML form of the insertion; for hidden techniques it is the technique.
# - marker: a made-up code word or host that appears only in this payload. It labels the
#   injection for measurement (did it reach a chunk? did the spec change?). The guard never
#   sees markers: a test checks that no rule mentions one.
# - url: the address the payload pushes; the "obedient model" adds it to the spec as a source.
# - page: one of the 8 real pages; anchor: insert after the Nth matching content paragraph
#   (the count wraps around on pages with fewer paragraphs).
# Rules are tuned on `dev` only; `test` is run once. The first test split (run 2026-10-28) is
# now part of dev (`was` keeps its old id); the current test split is the second one.
# check-data also checks that every injection changes the spec with the screen off, every
# control reaches the chunks, and no test item inserts where a dev item does.
version: 2.0.0
review: {status: draft, reviewer: null, date: null}
pages: [ftc-endorsement-faq.html, ftc-can-spam.html, ftc-advertising-hub.html, nist-ai-rmf.html,
  google-seo-starter.html, google-helpful-content.html, owasp-llm01.html, wikipedia-rag.html]
