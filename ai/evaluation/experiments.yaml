# AI-25 experiment registry: every committed report and how to reproduce it.
# `python -m evaluation.reproduce check` fails when a report under ai/evaluation/*/reports/
# has no entry here, so every new experiment must add one. Docs: docs/ai/experiments.md.
#
# kind: offline (deterministic, re-run from recorded_at), live (paid model calls: listed,
#   never re-run; re-scored offline once its predictions are tracked), rescore (offline,
#   from tracked predictions). recorded_at: the commit that added the report.
# status: pending-merge = the report is on another branch; check skips the entry while
#   the report is absent and checks it fully once it is present.
version: 1
# Fields never compared (volatile or filled in by hand). Never a metric, count or label.
# A per-entry addition needs `ignore_extra` with a written reason.
ignore: [date, created, run, latency_ms, mean_ms, usage, cost_usd, human_review]
data_files:
  - path: ai/evaluation/injection/reports/llm-verdicts-test-2026-11-02.json
    why: the saved LLM-screen verdicts of the 2 Nov live run; an input of E6, not a report
