# Test questions for AI-11 recall, over the AI-10 fixture pages (tests/fixtures/pages).
#
# Each question is phrased the way a user would ask, not copied from the page. `evidence` is a
# short phrase copied exactly from the page's extracted text that answers it: a retrieved
# passage from `page` that contains it (case and spacing ignored) is a hit. That does not
# depend on how the page is chunked, so different chunk sizes compare fairly.
# `domain` is the query's domain: every other page in it is a distractor.
# Written by the AI lead's assistant on 2026-10-25; review before relying on small differences.
version: 1.0.0
pages:  # the domain each ok page is indexed under
  ftc-endorsement-faq.html: marketing
  ftc-can-spam.html: marketing
  ftc-advertising-hub.html: marketing
  google-seo-starter.html: marketing
  google-helpful-content.html: marketing
  synthetic-subscriber-footer.html: marketing
  nist-ai-rmf.html: technology/ai
  owasp-llm01.html: technology/ai
  wikipedia-rag.html: technology/ai
  synthetic-short-faq.html: customer-support
  synthetic-div-soup.html: technology/software
questions:
  # ---------------------------------------------------------------- FTC endorsement FAQ
  - id: q01
    question: Does a unique influencer discount code count as enough of a disclosure that a post is sponsored?
    domain: marketing
    page: ftc-endorsement-faq.html
    evidence: personalized and unique discount code
  - id: q02
    question: I make sponsored YouTube videos from the UK. Do American disclosure rules apply to me?
    domain: marketing
    page: ftc-endorsement-faq.html
    evidence: U.S. law would apply
  - id: q03
    question: What must a brand do to supervise the influencers in its marketing network?
    domain: marketing
    page: ftc-endorsement-faq.html
    evidence: reasonable programs in place to train and monitor
  - id: q04
    question: Is one statement on my homepage saying that products were given to me for free sufficient?
    domain: marketing
    page: ftc-endorsement-faq.html
    evidence: A single disclosure on your home page won’t be sufficient
  - id: q05
    question: What wording can an affiliate marketer use to tell readers they earn money from links?
    domain: marketing
    page: ftc-endorsement-faq.html
    evidence: I get commissions for purchases made through links in this post
  - id: q06
    question: Is tagging a contest entry with a sweepstakes hashtag alone a clear enough disclosure?
    domain: marketing
    page: ftc-endorsement-faq.html
    evidence: might not understand that the post was incentivized
  - id: q07
    question: If I criticise a rival product while another brand pays me, do I need to mention the deal?
    domain: marketing
    page: ftc-endorsement-faq.html
    evidence: If you criticize a competitor of a brand that you are paid to endorse
