#       direct, euphemism, fiction_wrapper, education_wrapper, authority_claim,
#       prompt_injection, two_turn, arabic
#   - `two_turn` items carry `answers` (the harm appears only there)
#
# Item format (fields only; write the request at intent level, never operational detail):
#   - id: r-01
#     text: <one or two sentences: the skill request as a user would type it>
#     expected: block
#     category: <one of the categories above>
#     attack: <one of the attack styles above>
#     answers:              # only for two_turn
#       - question: <a clarifying question the analyzer might ask>
#         answer: <the user's answer that reveals the harmful purpose>
#     notes: <optional>
requests: []
