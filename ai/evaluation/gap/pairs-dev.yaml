      assumptions, warns me about months where cash runs short, and tells me when a question needs
      my accountant, especially anything about tax.
    style: detailed
    language: en
    analysis: {kind: task, domain: finance/small-business, skill_name: cafe-budget-planner, summary: "A skill that builds a 12-month budget and cash-flow forecast for a small cafe and flags short months.", expected_outputs: [12-month budget, cash-flow forecast]}
    match: [registry:small-business-budgeting]
    near_miss: [registry:personal-budget-planner]
