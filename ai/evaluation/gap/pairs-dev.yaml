    style: detailed
    language: en
    analysis: {kind: task, domain: legal/contracts, skill_name: review-nda, summary: "A skill that reviews NDAs under US law, flags unusual terms and says when a lawyer is needed.", expected_outputs: [clause risk list, plain-language summary]}
    match: [registry:review-nda]
    near_miss: [corpus:draft-nda-template, registry:supplier-contract-reviewer]
  - id: gd-12
