      product claims and influencer posts are honest and properly disclosed.
    style: detailed
    language: en
    analysis: {kind: role, domain: marketing/strategy, skill_name: ceramics-marketing-strategist, summary: "A marketing strategist role for a small ceramics shop that defines buyers, positioning and seasonal campaigns with honest claims.", expected_outputs: [buyer personas, positioning, campaign plan]}
