  # ------------------------------------------------------------- seed skill requests
  - id: gt-01
    text: >-
      We are a 6-person startup building a support chatbot on top of an LLM. I want a skill that
      acts like a senior AI engineer for Codex: it should help us pick models and embeddings,
      design retrieval over our help-centre articles, write evaluation sets, and warn us about cost
      and prompt-injection risks before we ship.
    style: detailed
    language: en
    analysis: {kind: role, domain: technology/ai, skill_name: support-bot-ai-engineer, summary: "A senior AI engineer role that helps a startup build an LLM support chatbot: models, retrieval, evaluation and risks.", expected_outputs: [model choice, retrieval design, evaluation set]}
    match: [registry:ai-engineer]
    near_miss: [registry:llm-prompt-engineer]
  - id: gt-02
    text: can you make something that checks my code
    style: vague
    language: en
    analysis: {kind: task, domain: technology/software-engineering, skill_name: code-checker, summary: "A skill that checks the user's code for problems.", expected_outputs: []}
    match: [registry:code-reviewer]
    near_miss: [corpus:secure-code-auditor, registry:unit-test-writer]
  - id: gt-03
    text: >-
      I want a Codex skill that reviews diffs the way our senior engineers do: first understand
      what the change is for, then look for real bugs and security holes, then maintainability.
      Comments must be ranked (blocking, should fix, nit), point to exact lines and suggest a fix.
      It must not nitpick formatting that our linter already handles.
    style: detailed
    language: en
    analysis: {kind: task, domain: technology/software-engineering, skill_name: diff-reviewer, summary: "A skill that reviews diffs for bugs, security and maintainability with ranked, line-level comments.", expected_outputs: [ranked review comments]}
    match: [registry:code-reviewer]
    near_miss: [corpus:secure-code-auditor, registry:unit-test-writer]
  - id: gt-04
    text: >-
      Our sales team exports CSVs from the CRM every week and nobody trusts the numbers. I want a
      skill that behaves like an experienced data analyst: it should check the data for problems
      first, write the pandas or SQL code, pick the right chart, and explain what the result means
      and how sure we can be, in plain language for the sales director.
    style: detailed
    language: en
