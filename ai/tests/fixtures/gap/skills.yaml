# Skill cards for the Gap Checker's fake index (AI-08). All text is our own: the 10 seed skills
# of the benchmark (3 built from their example SkillSpecs) and hand-written distractors, many of
# them deliberate near-misses of a seed skill. No third-party SKILL.md content is copied.
# Corpus cards stand in for DE-08's public corpus; their URLs are placeholders.
version: 0.1.0
cards:
  # ------------------------------------------------------------- seed skills (registry)
  - {spec: examples/skillspec/ai-engineer.yaml, source: registry}
  - {spec: examples/skillspec/marketing-strategist.yaml, source: registry}
  - {spec: examples/skillspec/review-nda.yaml, source: registry}
  - id: registry:code-reviewer
    name: code-reviewer
    title: Review Code Changes
    kind: task
    domain: technology/software-engineering
    description: Reviews a code change for correctness, security and maintainability, and gives prioritised, actionable comments.
    use_when:
      - reviewing a pull request or diff before it is merged
      - checking a function or module for bugs and security holes
      - ranking review comments as blocking, should fix or nit
    source: registry
  - id: registry:data-analyst
    name: data-analyst
    title: Data Analyst
    kind: role
    domain: data/analytics
    description: Data analyst who turns business questions into clean queries, sound analyses and clear charts, and says how confident the result is.
    use_when:
      - answering a business question from a CSV, spreadsheet or database
      - writing SQL or pandas code for an analysis
      - choosing a chart and explaining whether a change is real or noise
    source: registry
  - id: registry:explain-medical-results
    name: explain-medical-results
    title: Explain Medical Test Results
    kind: task
    domain: medical/patient-education
    description: Explains lab and test results in plain language so patients can prepare questions for their clinician. Never diagnoses or replaces medical advice.
    use_when:
      - a patient asks what a lab value or reference range means
      - explaining a blood test report line by line in plain language
      - preparing questions to ask the doctor about a result
    source: registry
  - id: registry:hr-recruiter
    name: hr-recruiter
    title: HR Recruiter
    kind: role
    domain: hr/recruiting
    description: Recruiter who writes inclusive job ads, structured interview plans and fair screening criteria, and protects candidates' personal data.
    use_when:
      - writing or improving a job ad
      - building a structured interview plan with a scoring guide
      - defining fair screening criteria for a role
    source: registry
  - id: registry:incident-postmortem
    name: incident-postmortem
    title: Incident Postmortem
    kind: workflow
    domain: technology/incident-response
    description: Guides a team through a blameless incident postmortem, from timeline to root causes to tracked action items.
    use_when:
      - writing the postmortem after a production outage
      - building an incident timeline from logs and chat
      - running a blameless postmortem meeting
    source: registry
  - id: registry:small-business-budgeting
    name: small-business-budgeting
    title: Small Business Budgeting
    kind: task
    domain: finance/small-business
    description: Builds and reviews simple budgets and cash-flow plans for small businesses, with clear assumptions. General information, not financial or tax advice.
    use_when:
      - building a monthly or yearly budget for a small business
      - forecasting cash flow and spotting months that run short
      - checking whether the business can afford a purchase
    source: registry
  - id: registry:write-press-release
    name: write-press-release
    title: Write a Press Release
    kind: task
    domain: writing/public-relations
    description: Writes clear, newsworthy press releases in standard format, with accurate facts and quotes approved by the people quoted.
    use_when:
      - announcing a product launch, funding round or new executive to the press
      - turning notes about company news into a press release
      - checking a draft release against press-release format
    source: registry

