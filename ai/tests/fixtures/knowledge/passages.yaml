  # Summarised by Claude Code from the live documents on 2026-11-19: AI-09 sources #1 and #3
  # (PDFs, read as text). Skipped: #2 EPA (one line of text), #4 State Library of Queensland
  # (404), #5 GOV.UK (a list of links), #6 St Louis (unreachable), #7 GSS (withdrawn), #8 Census
  # (one sentence), #9 Brookings (about education standards), #10 GSA (unreachable).
  - chunk_id: data-ct-viz-01
    domain: data/analytics
    source_url: https://portal.ct.gov/-/media/ct-data/data-visualization-guidelines.pdf
    title: Data Visualization Guidelines
    retrieved: 2026-11-19
    text: >-
      Connecticut's open-data guidelines start a chart or dashboard with two questions: what the
      goal is and who the audience is. Ask which questions the work must answer, whether readers
      are technical, what they want to learn, and which format suits them, such as an
      interactive dashboard, a written report or slides.
  - chunk_id: data-ct-viz-02
    domain: data/analytics
    source_url: https://portal.ct.gov/-/media/ct-data/data-visualization-guidelines.pdf
    title: Data Visualization Guidelines
    retrieved: 2026-11-19
    text: >-
      Pick the points or trends that tell the story, give each chart one clear purpose, then
      match the chart to the job: lines or bars for change over time, pie or stacked bars for
      parts of a whole, bars for comparisons, scatterplots or heat maps for correlation,
      histograms for distributions and choropleths for maps.
  - chunk_id: data-ct-viz-03
    domain: data/analytics
    source_url: https://portal.ct.gov/-/media/ct-data/data-visualization-guidelines.pdf
    title: Data Visualization Guidelines
    retrieved: 2026-11-19
    text: >-
      For clarity the guidelines advise removing clutter such as borders, gridlines and
      repeated labels, writing a title a newcomer understands (often the main finding), labelling
      data directly, using plain words, and testing a draft on someone who does not know the
      data well.
  - chunk_id: data-ct-viz-04
    domain: data/analytics
    source_url: https://portal.ct.gov/-/media/ct-data/data-visualization-guidelines.pdf
    title: Data Visualization Guidelines
    retrieved: 2026-11-19
    text: >-
      Give readers context such as trends or comparison groups, publish the underlying data where
      possible, and add a short text summary of what the chart shows, which also helps screen
      reader users. Design with equity and accessibility in mind: colour schemes that work for
      colour-blind readers, and people-first language.
  - chunk_id: data-alx-analytics-01
    domain: data/analytics
    source_url: https://www.alexandriava.gov/sites/default/files/2023-08/Data%20Analytics%20Service%20Guidelines.pdf
    title: Data Analytics Service Guidelines
    retrieved: 2026-11-19
    text: >-
      The City of Alexandria's analytics office aims to turn data into better policy, investment
      and services. Its guidelines start from the organisation's priority questions and from what
      end users need: analysts agree research questions and scope with stakeholders, and treat
      the user's need, not a chosen tool, as the starting point.
  - chunk_id: data-alx-analytics-02
    domain: data/analytics
    source_url: https://www.alexandriava.gov/sites/default/files/2023-08/Data%20Analytics%20Service%20Guidelines.pdf
    title: Data Analytics Service Guidelines
    retrieved: 2026-11-19
    text: >-
      Alexandria expects analysis to be objective and rigorous enough to inform decisions, built
      with the departments that know the topic, compliant with data protection law and city
      procedures, shared publicly through key indicators where possible, and reviewed over time
      so the service keeps improving.
  # ---------------------------------------------------------------- medical/patient-education
  # Summarised by Claude Code from the live pages on 2026-11-19: AI-09 sources #1 and #2
  # (MedlinePlus), which cover the explain-medical-results skill directly.
  - chunk_id: med-mlp-education-01
    domain: medical/patient-education
    source_url: https://medlineplus.gov/ency/patientinstructions/000455.htm
    title: "Choosing effective patient education materials: MedlinePlus Medical Encyclopedia"
    retrieved: 2026-11-19
    text: >-
      MedlinePlus advises clinicians to begin patient education by finding out what the patient
      already knows and wants to know, how ready they are to learn and what might get in the way.
      Then make a plan with the patient and their support person, agree realistic learning goals
      and pick resources that fit the patient.
  - chunk_id: med-mlp-education-02
    domain: medical/patient-education
    source_url: https://medlineplus.gov/ency/patientinstructions/000455.htm
    title: "Choosing effective patient education materials: MedlinePlus Medical Encyclopedia"
    retrieved: 2026-11-19
    text: >-
      Teach what the patient needs to know before what is nice to know, give only as much as
      they can take in at once, and organise it. Most teaching should cover what to do and why,
      when to expect results, which warning signs to watch for, what to do if a problem occurs
      and whom to contact with questions.
  - chunk_id: med-mlp-education-03
    domain: medical/patient-education
    source_url: https://medlineplus.gov/ency/patientinstructions/000455.htm
    title: "Choosing effective patient education materials: MedlinePlus Medical Encyclopedia"
    retrieved: 2026-11-19
    text: >-
      When choosing materials, a mix of media often works best, and the patient's literacy,
      numeracy and culture should shape the plan. MedlinePlus warns against fear tactics, asks
      clinicians to review every material before sharing it, and says no resource fully
      replaces one-on-one teaching.
  - chunk_id: med-mlp-labs-01
    domain: medical/patient-education
    source_url: https://medlineplus.gov/lab-tests/how-to-understand-your-lab-results/
    title: "How to Understand Your Lab Results: MedlinePlus Medical Test"
    retrieved: 2026-11-19
    text: >-
      A lab test checks a sample of blood, urine or other fluid or tissue. Some tests show
      clearly whether a person has a condition; others give a general picture of health. Results
      alone are not a full picture: providers combine them with the exam and health history, so
      patients should discuss results with their provider even when they can read them online.
  - chunk_id: med-mlp-labs-02
    domain: medical/patient-education
    source_url: https://medlineplus.gov/lab-tests/how-to-understand-your-lab-results/
    title: "How to Understand Your Lab Results: MedlinePlus Medical Test"
    retrieved: 2026-11-19
    text: >-
      A reference range is the span of results seen in large groups of healthy people, and it can
      differ by group and by lab. A result outside it is not always a sign of a problem, and one
      inside it does not guarantee good health. Compare a result only with the range on that
      lab's report, and use the same lab to follow a trend.
  - chunk_id: med-mlp-labs-03
    domain: medical/patient-education
    source_url: https://medlineplus.gov/lab-tests/how-to-understand-your-lab-results/
    title: "How to Understand Your Lab Results: MedlinePlus Medical Test"
    retrieved: 2026-11-19
    text: >-
      Negative means the test did not find what it looked for, positive means it did, and
      inconclusive means it could not tell, which usually leads to a repeat test. No test is
      perfect: false positives and false negatives happen. Food, medicines, supplements, hard
      exercise, menstruation or skipped preparation such as fasting can affect results.
  # ---------------------------------------------------------------- hr/recruiting
  # Summarised by Claude Code from the live pages on 2026-11-19: AI-09 sources #1 (EEOC) and #3
  # (SHRM; its questions are not reproduced, only its advice summarised). Skipped: #2 DOL
  # (403 Access Denied).
  - chunk_id: hr-eeoc-practices-01
    domain: hr/recruiting
    source_url: https://www.eeoc.gov/prohibited-employment-policiespractices
    title: "Prohibited Employment Policies/Practices | U.S. Equal Employment Opportunity Commission"
    retrieved: 2026-11-19
    text: >-
      US federal law (EEOC) makes it illegal to publish a job advert that favours or discourages
      applicants because of race, colour, religion, sex (including pregnancy, sexual orientation
      and gender identity), national origin, age 40 or over, disability or genetic information.
      An advert asking for "recent college graduates", for example, may discourage older people.
  - chunk_id: hr-eeoc-practices-02
    domain: hr/recruiting
    source_url: https://www.eeoc.gov/prohibited-employment-policiespractices
    title: "Prohibited Employment Policies/Practices | U.S. Equal Employment Opportunity Commission"
    retrieved: 2026-11-19
    text: >-
      Recruiting and hiring must not discriminate on those grounds either: word-of-mouth hiring
      that keeps a workforce of one group can break the law, decisions may not rest on
      stereotypes, any test must be necessary and related to the job, and an applicant with a
      disability gets a reasonable accommodation unless it causes significant difficulty or
      expense.
  - chunk_id: hr-eeoc-practices-03
    domain: hr/recruiting
    source_url: https://www.eeoc.gov/prohibited-employment-policiespractices
    title: "Prohibited Employment Policies/Practices | U.S. Equal Employment Opportunity Commission"
    retrieved: 2026-11-19
    text: >-
      EEOC's rule for pre-employment questions: ask only what is needed to judge whether someone
      is qualified. Employers may not ask about disability before an offer, should avoid
      questions (such as club memberships) that reveal protected traits unless a business need
      justifies them, and should not ask for a photo until an offer has been accepted.
  - chunk_id: hr-eeoc-practices-04
    domain: hr/recruiting
    source_url: https://www.eeoc.gov/prohibited-employment-policiespractices
    title: "Prohibited Employment Policies/Practices | U.S. Equal Employment Opportunity Commission"
    retrieved: 2026-11-19
    text: >-
      The same protections cover decisions after hiring: job referrals by employers, agencies or
      unions, job assignments and promotions, pay and benefits, discipline and layoffs. An
      employer may also not give a negative or false reference, or refuse one, because of a
      person's protected traits.
  - chunk_id: hr-shrm-interview-01
    domain: hr/recruiting
    source_url: https://www.shrm.org/topics-tools/tools/interview-questions
    title: "Sample Job Interview Questions | SHRM"
    retrieved: 2026-11-19
    text: >-
      SHRM suggests building an interview from the few competencies that matter most for the job,
      with questions of two main kinds: behavioural ones, which ask for real examples from the
      candidate's past to predict future performance, and situational ones, which ask how the
      candidate would handle a described scenario.
  - chunk_id: hr-shrm-interview-02
    domain: hr/recruiting
    source_url: https://www.shrm.org/topics-tools/tools/interview-questions
    title: "Sample Job Interview Questions | SHRM"
    retrieved: 2026-11-19
    text: >-
      To stay fair and avoid legal problems, SHRM advises judging every candidate for a role
      against the same core criteria, with no favouritism. Most questions have no single right
      answer, so decide in advance what good answers look like for the role; the candidate's
      reasoning often matters as much as the answer.
  # ---------------------------------------------------------------- technology/incident-response
  # Summarised by Claude Code from the live pages on 2026-11-19: AI-09 sources #2 (PagerDuty's
  # postmortem template; the reviewed URL response.pagerduty.com/after/post_mortem_template/ now
  # redirects to docs.pagerduty.com, the page cited here, whose licence is not in the registry)
  # and #3 (NIST news on SP 800-61 Rev. 2). #1 (FBI PDF) was not needed.
  - chunk_id: inc-pd-postmortem-01
    domain: technology/incident-response
    source_url: https://docs.pagerduty.com/ops-guides/incident-response-guide/postmortem-template
    title: "Postmortem Template | PagerDuty Docs"
    retrieved: 2026-11-19
    text: >-
      PagerDuty books the postmortem meeting first, within five business days of the incident,
      before the write-up is filled in, and expects the page to be complete by the meeting. The
      page names an owner, the meeting time and a link to the incident call recording.
  - chunk_id: inc-pd-postmortem-02
    domain: technology/incident-response
    source_url: https://docs.pagerduty.com/ops-guides/incident-response-guide/postmortem-template
    title: "Postmortem Template | PagerDuty Docs"
    retrieved: 2026-11-19
    text: >-
      The template opens with a one- or two-sentence summary of contributing factors, timeline
      and impact, then describes what happened, the conditions that contributed (including any
      actions that made things worse, to learn from them) and what resolved it, both the
      temporary fix and the long-term solution.
  - chunk_id: inc-pd-postmortem-03
    domain: technology/incident-response
    source_url: https://docs.pagerduty.com/ops-guides/incident-response-guide/postmortem-template
    title: "Postmortem Template | PagerDuty Docs"
    retrieved: 2026-11-19
    text: >-
      Impact is recorded with exact numbers: minutes at each severity level, share of
      notifications delivered late, events dropped, accounts and users affected and support
      tickets raised. The template also lists the responders (incident commander, scribe,
      others) and a UTC timeline of key moments, each linked to the logs or tools behind it.
  - chunk_id: inc-pd-postmortem-04
    domain: technology/incident-response
    source_url: https://docs.pagerduty.com/ops-guides/incident-response-guide/postmortem-template
    title: "Postmortem Template | PagerDuty Docs"
    retrieved: 2026-11-19
    text: >-
      The review ends with what went well, what did not, and action items filed as tracked
      tickets: fixes for the contributing factor, preparedness work, remaining communication and
      process improvements. An internal summary goes out right after the meeting, and the public
      status-page post explains what happened and includes a genuine apology.
  - chunk_id: inc-nist-ir-01
    domain: technology/incident-response
    source_url: https://www.nist.gov/node/392186
    title: "Updated NIST Guide is a How-To for Dealing With Computer Security Incidents | NIST"
    retrieved: 2026-11-19
    text: >-
      NIST's Computer Security Incident Handling Guide (SP 800-61 Rev. 2) gives teams steps to
      build an incident response policy and plan. Each plan should state a mission, strategies
      and goals, how the organisation is set up to respond, metrics for its response capability
      and a way to keep the plan updated, and every incident should be reviewed afterwards.
  - chunk_id: inc-nist-ir-02
    domain: technology/incident-response
    source_url: https://www.nist.gov/node/392186
    title: "Updated NIST Guide is a How-To for Dealing With Computer Security Incidents | NIST"
    retrieved: 2026-11-19
    text: >-
      The guide asks teams to look at an attack by its method (what is happening and what needs
      fixing), by its impact (downtime, data stolen, resources needed to recover) and through
      coordination: sharing threat information with trusted organisations before and during an
      attack, after checking with legal what may be shared.
  # ---------------------------------------------------------------- legal/contracts
  # Summarised by Claude Code from the live pages on 2026-11-19: AI-09 sources #1 and #2
  # (Cornell LII Wex) and #4 (USPTO). US law, general information only.
  - chunk_id: legal-lii-nda-01
    domain: legal/contracts
    source_url: https://www.law.cornell.edu/wex/non-disclosure_agreement_(nda)
    title: "non-disclosure agreement (NDA) | Legal Information Institute"
    retrieved: 2026-11-19
    text: >-
      Under US contract law, a non-disclosure agreement binds the people who sign it to keep
      certain information confidential and not share it with anyone the agreement does not
      authorise. NDAs commonly protect trade secrets, negotiations and client information.
      Disclosure despite one is a breach of contract; an NDA may run indefinitely or have an end
      date.
  - chunk_id: legal-lii-nda-02
    domain: legal/contracts
    source_url: https://www.law.cornell.edu/wex/non-disclosure_agreement_(nda)
    title: "non-disclosure agreement (NDA) | Legal Information Institute"
    retrieved: 2026-11-19
    text: >-
      Courts generally enforce NDAs, but statutes and public policy limit them: they may be void
      as to criminal acts or unenforceable without required procedures. The Speak Out Act of
      2022 blocks pre-dispute NDAs from covering later sexual-harassment claims, and the
      National Labor Relations Act can bar overbroad NDAs about employees.
  - chunk_id: legal-lii-nda-03
    domain: legal/contracts
    source_url: https://www.law.cornell.edu/wex/non-disclosure_agreement_(nda)
    title: "non-disclosure agreement (NDA) | Legal Information Institute"
    retrieved: 2026-11-19
    text: >-
      Breaching an NDA can lead to substantial damages, and the other party may obtain a
      preliminary injunction. An NDA can also be breached without revealing secrets if it sets
      other duties, such as not publicly criticising a former employer. Many NDAs end after a
      stated period.
  - chunk_id: legal-lii-contract-01
    domain: legal/contracts
    source_url: https://www.law.cornell.edu/wex/contract
    title: "contract | Wex | US Law | LII / Legal Information Institute"
    retrieved: 2026-11-19
    text: >-
      A contract is an agreement creating mutual obligations that the law will enforce. It needs
      mutual assent (offer and acceptance), consideration (something of value exchanged),
      capacity and a lawful purpose. Remedies for breach include general, consequential and
      reliance damages and, in rare cases, specific performance.
  - chunk_id: legal-lii-contract-02
    domain: legal/contracts
    source_url: https://www.law.cornell.edu/wex/contract
    title: "contract | Wex | US Law | LII / Legal Information Institute"
    retrieved: 2026-11-19
    text: >-
      US contract law comes mostly from state common law, supplemented by statutes such as the
      Statute of Frauds, which requires some contracts to be in writing. The Uniform Commercial
      Code governs sales of goods, and the CISG covers cross-border sales. Even informal
      agreements can bind when the elements of a contract are present.
  - chunk_id: legal-uspto-trade-secret-01
    domain: legal/contracts
    source_url: https://www.uspto.gov/ip-policy/trade-secret-policy
    title: "Trade secret policy | USPTO"
    retrieved: 2026-11-19
    text: >-
      The USPTO describes a trade secret as information that has economic value because it is
      not generally known, that others cannot properly find out, and that its owner takes
      reasonable steps to keep secret. All three conditions are required; if one lapses, so
      does the protection, which otherwise has no time limit.
  # ---------------------------------------------------------------- finance/small-business
  # Summarised by Claude Code from the live pages on 2026-11-19: AI-09 sources #3 and #5 (IRS)
  # and #4 (SBA). Skipped: #1 and #2 SCORE (403 behind a bot check), #6 SBA (timed out).
  - chunk_id: fin-irs-sbweek-01
    domain: finance/small-business
    source_url: https://www.irs.gov/node/122126
    title: "National Small Business Week: IRS.gov offers A-Z resources for small businesses | Internal Revenue Service"
    retrieved: 2026-11-19
    text: >-
      The IRS points small businesses, including the self-employed, contractors and gig workers,
      to its Small Business and Self-Employed Tax Center first. Its pages follow a business's
      life: a checklist for starting out, and help choosing a business structure, which decides
      the income tax return forms the business must file.
  - chunk_id: fin-irs-sbweek-02
    domain: finance/small-business
    source_url: https://www.irs.gov/node/122126
    title: "National Small Business Week: IRS.gov offers A-Z resources for small businesses | Internal Revenue Service"
    retrieved: 2026-11-19
    text: >-
      For running a business, the IRS pages explain getting an Employer Identification Number,
      keeping good records and filing and paying taxes, and later how to close a business. To
      keep up with obligations such as withholding deposits and quarterly filing, the IRS offers
      an online tax calendar of due dates and a free small-business e-newsletter.
  - chunk_id: fin-irs-sbhand-01
    domain: finance/small-business
    source_url: https://www.irs.gov/node/1081
    title: "IRS Lends a Hand to Small Business | Internal Revenue Service"
    retrieved: 2026-11-19
    text: >-
      An IRS release from 2004 lists free online help for small businesses: how the tax code
      treats each business structure, applying for an EIN online, e-filing employment taxes and
      other returns, and paying federal taxes electronically through EFTPS at any hour instead
      of by check.
  - chunk_id: fin-sba-finances-01
    domain: finance/small-business
    source_url: https://www.sba.gov/blog/2021/2021-04/understand-your-finances-grow-your-business/
    title: "Understand Your Finances and Grow Your Business - Small Business Administration"
    retrieved: 2026-11-19
    text: >-
      The SBA calls understanding your finances key to small-business success and suggests
      setting finance goals, such as getting a loan, raising revenue or learning about taxes.
      Its resource partners help owners prepare loan applications: reviewing the business plan
      and organising tax returns and bank statements before they go to a lender.
  - chunk_id: fin-sba-finances-02
    domain: finance/small-business
    source_url: https://www.sba.gov/blog/2021/2021-04/understand-your-finances-grow-your-business/
    title: "Understand Your Finances and Grow Your Business - Small Business Administration"
    retrieved: 2026-11-19
    text: >-
      The SBA's free Financing Your Business course compares loans, grants, venture capital and
      crowdfunding and ends with a worksheet for assessing your own needs. SBA-guaranteed loans
      suit creditworthy owners who cannot get conventional financing, and the Lender Match tool
      connects them with participating lenders to compare rates, terms and fees.
