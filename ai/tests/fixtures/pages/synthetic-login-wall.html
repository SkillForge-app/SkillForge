<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in | Brightdesk Help Centre</title>
</head>
<body>
<header><a href="/">Brightdesk</a></header>
<main>
<h1>Sign in to continue</h1>
<p>This article is only available to Brightdesk customers. Sign in with your work account to read it.</p>
<form action="/session" method="post">
  <label for="email">Work email</label>
  <input id="email" name="email" type="email" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
  <a href="/reset">Forgot your password?</a>
</form>
</main>
<footer><p>&copy; 2026 Brightdesk Ltd.</p></footer>
</body>
</html>
