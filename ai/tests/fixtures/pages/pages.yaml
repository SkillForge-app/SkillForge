# Labelled pages for AI-10 extraction tests and the quality report (evaluation/extraction).
#
# Real pages: saved once on 2026-10-25, one GET each after a robots.txt check, openly licensed
# only. To keep the repo small, inline <svg> and <style> bodies over 2,000 characters were
# emptied; everything else is byte-for-byte as served. Tests never fetch.
# Synthetic pages: written for these tests, modelled on real page structures.
#
# expected: [] means the page must pass; otherwise the exact quality reasons, in REASONS order.
# must_contain: short facts that must survive in the chunks (case and spacing ignored).
# must_not_contain: navigation, cookie and footer text that must not leak into the chunks.
version: 1.2.0
pages:
  # ---------------------------------------------------------------- real pages
  - file: ftc-endorsement-faq.html
    url: https://www.ftc.gov/business-guidance/resources/ftcs-endorsement-guides-what-people-are-asking
    retrieved: 2026-10-25
    licence: US Government work, public domain (17 U.S.C. 105)
    expected: []
    title: "FTC's Endorsement Guides: What People Are Asking"
    must_contain:
      - clearly and conspicuously
      - endorsements must be honest and not misleading
      - significant minority of consumers
    must_not_contain: &ftc_chrome
      - An official website of the United States government
      - Here’s how you know
      - Report Fraud
      # FTC template text inside the article body ("About the FTC" and the Ombudsman note);
      # site boilerplate removal takes it out. Not the bare phrase "about the FTC": real
      # content uses it ("What about the FTC's Guides...").
      - The FTC works to prevent fraudulent
      - ReportFraud.ftc.gov
      - Subscribe to the FTC’s Business Blog
      - National Small Business Ombudsman
      - Your Opportunity to Comment
