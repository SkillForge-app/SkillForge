[project]
name = "skillforge-data"
version = "0.1.0"
description = "SkillForge Data Engineering: crawling, processing, knowledge store"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "tree-sitter>=0.23",
    "GitPython>=3.1",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.7",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# AI's code (the `skillforge` package in ../ai: extract_page, embed_sync, normalise_url, ExtractConfig), for the real adapter
# (skillforge_data/adapters/ai.py). OPTIONAL and heavy (spaCy, litellm, fastembed): the default install and the default CI do not use it.
# `skillforge` is NOT the name of a package on PyPI that we own: install it from the path (uv: `uv sync --extra ai`, which reads
# [tool.uv.sources] below) or `pip install -e ../ai`. Never `pip install ".[ai]"` with plain pip, which would look the name up on PyPI.
ai = ["skillforge"]

[tool.uv.sources]
skillforge = { path = "../ai", editable = true }

[tool.setuptools.packages.find]
include = ["skillforge_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `ai_real` tests need AI's package installed: they are deselected by default (deselected is not skipped; data.yml fails on skips).
# Run them with: pytest -m ai_real
addopts = "-m 'not ai_real'"
markers = [
    "ai_real: contract tests against the real `skillforge` package (extra `ai`); not part of the default run",
]
