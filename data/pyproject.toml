[project]
name = "skillforge-data"
version = "0.1.0"
description = "SkillForge Data Engineering: crawling, processing, knowledge store"
requires-python = ">=3.11.5"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "tree-sitter>=0.23",
    "GitPython>=3.1",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.7",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# There is deliberately NO extra for AI's package (`skillforge` in ../ai) and no [tool.uv.sources]: a name like that on PyPI is not ours
# (dependency confusion). The adapter imports it lazily. How to install it from the path: docs/ai-install.md.
[tool.setuptools.packages.find]
include = ["skillforge_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `ai_real` tests need AI's package installed (docs/ai-install.md): they are deselected by default (deselected is not skipped; data.yml fails on skips).
# Run them with: pytest -m ai_real
addopts = "-m 'not ai_real'"
markers = [
    "ai_real: contract tests against the real `skillforge` package (docs/ai-install.md); not part of the default run",
]
