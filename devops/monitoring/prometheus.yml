# Prometheus (OPS-10). Loads AI-21's rules as they are (ai/ops/alerts.yaml) and DevOps' own
# (devops/monitoring/rules/). Check: promtool check config (devops/monitoring/ci-checks.sh).
global:
  # The ai-metrics exporter holds a new series at 0 for 35 s, more than two of these intervals.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/ai/alerts.yaml
  - /etc/prometheus/rules/ops/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # AI-21's metrics, from the AI services' logs (ai/ops/metrics.yaml + metrics.extra.yaml).
  - job_name: ai-metrics
    static_configs:
      - targets: [ai-metrics:9464]

  # RQ queue lengths (redis_key_size{key="rq:queue:..."}).
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox:9115]

  # Health probes of the services, through blackbox. Found by compose's DNS names, so a service
  # that isn't running (another profile) is simply not probed; a STOPPED one is not either, which
  # `demo.sh status` covers. A running one that doesn't answer fires ServiceDown.
  - job_name: probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 15s
      - names: [web]
        type: A
        port: 3000
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
      - source_labels: [__address__, __meta_dns_name]
        regex: "(.+);api"
        replacement: "http://${1}/health"
        target_label: __param_target
      - source_labels: [__address__, __meta_dns_name]
        regex: "(.+);web"
        replacement: "http://${1}/"
        target_label: __param_target
      - source_labels: [service]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # The API's request rate, errors and latency: Backend has no /metrics yet. When it does (for
  # example prometheus-fastapi-instrumentator), uncomment this job; the Services dashboard's API
  # row and devops/monitoring/rules/ops.yaml's commented API rules use it.
  # - job_name: api
  #   static_configs:
  #     - targets: [api:8000]
