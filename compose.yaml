# Shared local stack (OPS-03). From the repo root:
#   cp .env.example .env     # once
#   docker compose up -d
# How to stop, reset and connect: devops/compose.md
# Every image is pinned by digest to a release at least two weeks old.
name: skillforge

services:
  postgres:
    # The same image as .github/workflows/data.yml.
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    # A fixed name, so `docker exec skillforge-postgres ...` (as in data/CLAUDE.md) works from anywhere.
    container_name: skillforge-postgres
    environment:
      POSTGRES_USER: skillforge
      POSTGRES_DB: skillforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs on the first start only (empty volume): pgvector, then Data Engineering's SQL.
      - ./devops/compose/postgres-initdb:/docker-entrypoint-initdb.d:ro
      # Data Engineering's files, read in place. If data/ is not checked out, Docker creates an
      # empty data/db/ folder and the init script only enables pgvector.
      - ./data/db:/skillforge/data-db:ro
    healthcheck:
      # Over TCP: during the first-start init the server listens only on its socket, so this
      # passes only once the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U skillforge -d skillforge"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:8.8.2-alpine@sha256:f4ded511357f7c60551133fbceb0d07874a2240bfe3d1baaa49769a70ff83465
    # No password: local only, and the port is bound to 127.0.0.1.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------- api
  # The API (FastAPI, backend/) and its one-shot migration. Only with the `api` profile:
  #   docker compose --profile api up -d --build
  # `migrate` builds the image and runs `alembic upgrade head`; `api` starts only after it exited 0.
  migrate:
    profiles: [api]
    build:
      context: ./backend
      dockerfile: ../devops/docker/api.Dockerfile
    image: skillforge-api:local
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://skillforge:${POSTGRES_PASSWORD}@postgres:5432/skillforge
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [api]
    image: skillforge-api:local  # built by `migrate`
    pull_policy: never
    environment:
      DATABASE_URL: postgresql+psycopg://skillforge:${POSTGRES_PASSWORD}@postgres:5432/skillforge
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      # The slim image has no curl; Python's urllib does the same.
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------- worker (placeholder)
  # TODO(queue decision): the worker that runs the AI pipeline (ai/core/pipeline/interface.py).
  # Waits for the queue library choice (recommended: RQ 2.12, see the OPS-03 PR) and for Backend to
  # move its root core/ package under backend/: ai/ also installs a top-level `core`, and the
  # worker imports both.
  # - Image: Backend's and AI's code together, e.g. devops/docker/worker.Dockerfile with
  #   context ./backend and `additional_contexts: {ai: ./ai}`.
  # - LLM provider keys only from ai/.env, never from this file.
  # - AI's rate limits are per process: total provider rate = worker processes x the limits.
  # worker:
  #   profiles: [api]
  #   build:
  #     context: ./backend
  #     dockerfile: ../devops/docker/worker.Dockerfile
  #     additional_contexts:
  #       ai: ./ai
  #   command: ["rq", "worker", "--with-scheduler", "--url", "redis://redis:6379/0", "skills"]
  #   env_file:
  #     - ai/.env
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://skillforge:${POSTGRES_PASSWORD}@postgres:5432/skillforge
  #     REDIS_URL: redis://redis:6379/0
  #     SKILLFORGE_VECTOR_STORE: pgvector
  #     SKILLFORGE_PGVECTOR_DSN: postgresql://skillforge_ai_reader:<password>@postgres:5432/skillforge
  #     SKILLFORGE_PGVECTOR_TABLE: knowledge.knowledge_chunks
  #     SKILLFORGE_MODEL_CACHE: /models
  #   volumes:
  #     - models:/models
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  #     redis:
  #       condition: service_healthy

  # ---------------------------------------------------------------- web app

  # The web app (Next.js, frontend/). Only with the `web` profile, so a plain `docker compose up`
  # works without frontend/ and doesn't build it:
  #   docker compose --profile web up -d --build
  web:
    profiles: [web]
    build:
      context: ./frontend
      dockerfile: ../devops/docker/web.Dockerfile
      args:
        # Baked into the browser code at build time: the URL the BROWSER calls, so a host URL,
        # not a service name. Changing it needs a rebuild (--build).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: skillforge-web:local
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      # The slim image has no curl; Node's fetch does the same.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # No depends_on: api, so `--profile web` works alone. Both: --profile api --profile web.

volumes:
  pgdata:
  redisdata:
  # models:   # for the worker, once it exists
